name: Publicar jogo no GitHub Pages

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Baixar o projeto
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Instalar dependências necessárias para Ruby2D
      #
      # IMPORTANTE:
      # Isso precisa vir ANTES do ruby/setup-ruby com
      # bundler-cache: true, porque bundler-cache executa
      # bundle install automaticamente.
      # ------------------------------------------------------------
      - name: Instalar dependências de compilação
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev

      # ------------------------------------------------------------
      # 3. Ruby
      #
      # Ruby 3.4 é uma opção mais conservadora para Ruby2D
      # do que Ruby 4.0 neste momento.
      #
      # O ruby/setup-ruby lê "BUNDLED WITH" do Gemfile.lock.
      # ------------------------------------------------------------
      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 1

      # ------------------------------------------------------------
      # 4. Diagnóstico
      # ------------------------------------------------------------
      - name: Mostrar versões
        run: |
          ruby --version
          bundle --version
          bundle list

      # ------------------------------------------------------------
      # 5. Preparar Ruby2D
      #
      # ruby2d setup compila as dependências usadas pelo Ruby2D,
      # incluindo SDL e mruby.
      # ------------------------------------------------------------
      - name: Preparar Ruby2D e mruby
        run: |
          bundle exec ruby2d setup

      # ------------------------------------------------------------
      # 6. Teste básico
      # ------------------------------------------------------------
      - name: Testar o jogo
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: offscreen
        run: |
          bundle exec ruby main.rb --smoke

      # ------------------------------------------------------------
      # 7. Instalar Emscripten
      # ------------------------------------------------------------
      - name: Instalar Emscripten
        run: |
          git clone \
            --depth 1 \
            --branch 6.0.11 \
            https://github.com/emscripten-core/emsdk.git \
            "$RUNNER_TEMP/emsdk"

          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11

      # ------------------------------------------------------------
      # 8. Compilar versão WebAssembly
      # ------------------------------------------------------------
      - name: Compilar jogo para WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          emcc --version

          bundle exec ruby scripts/build_web.rb

      # ------------------------------------------------------------
      # 9. Verificar saída
      # ------------------------------------------------------------
      - name: Verificar build
        run: |
          echo "Conteúdo de build/web:"
          find build/web -maxdepth 2 -type f -print

          if [ ! -f build/web/index.html ]; then
            echo "ERRO: build/web/index.html não foi criado."
            exit 1
          fi

      # ------------------------------------------------------------
      # 10. Preparar artefato do GitHub Pages
      # ------------------------------------------------------------
      - name: Upload do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  # ==============================================================
  # DEPLOY
  # ==============================================================

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
