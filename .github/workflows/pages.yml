name: Publicar jogo no GitHub Pages

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar dependências de compilação
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          cache-version: 2

      - name: Mostrar versões
        run: |
          echo "Ruby:"
          ruby --version

          echo "Bundler:"
          bundle --version

          echo "Gems:"
          bundle list

      - name: Preparar Ruby2D e mruby
        run: |
          bundle exec ruby2d setup --yes

      - name: Testar o jogo
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: offscreen
        run: |
          bundle exec ruby main.rb --smoke

      - name: Instalar Emscripten
        run: |
          git clone \
            --depth 1 \
            --branch 6.0.11 \
            https://github.com/emscripten-core/emsdk.git \
            "$RUNNER_TEMP/emsdk"

          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11

      - name: Compilar jogo para WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          echo "Versão do Emscripten:"
          emcc --version

          bundle exec ruby scripts/build_web.rb

      - name: Verificar build
        run: |
          echo "Arquivos gerados:"
          find build/web -maxdepth 3 -type f -print

          if [ ! -d build/web ]; then
            echo "ERRO: a pasta build/web não foi criada."
            exit 1
          fi

          if [ ! -f build/web/index.html ]; then
            echo "ERRO: build/web/index.html não foi criado."
            exit 1
          fi

      - name: Upload do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
